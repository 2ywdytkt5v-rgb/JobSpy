name: JobSpy external collection (recovery)

on:
  workflow_dispatch:
  schedule:
    # 05:30 China Standard Time Mon-Fri (21:30 UTC previous day).
    - cron: "30 21 * * 0-4"
  pull_request:
    paths:
      - ".github/workflows/jobspy-daily-collection.yml"
      - "scripts/jobspy_daily_collect.py"

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install isolated JobSpy package
        run: python -m pip install --disable-pip-version-check "python-jobspy==1.1.82"
      - name: Collect source data with checkpoints
        env:
          SMOKE: ${{ github.event_name == 'pull_request' }}
        run: |
          if [ "$SMOKE" = "true" ]; then
            python scripts/jobspy_daily_collect.py --smoke
          else
            python scripts/jobspy_daily_collect.py
          fi
      - name: Keep raw data and coverage audit even if some sources fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jobspy-raw-${{ github.run_id }}
          path: jobspy-output/
          if-no-files-found: warn
          retention-days: 30
